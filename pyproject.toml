[project]
name = "ko-parser"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["ko-parser-contracts", "ko-parser-engine"]

[tool.uv]
package = false

[tool.uv.sources]
ko-parser-contracts = { workspace = true }
ko-parser-engine = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.3", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "packages/engine/tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error::EncodingWarning"]
