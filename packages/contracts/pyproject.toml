[project]
name = "ko-parser-contracts"
version = "0.3.0"
description = "Data contracts for the ko-parser document parsing engine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ko_parser_contracts"]
