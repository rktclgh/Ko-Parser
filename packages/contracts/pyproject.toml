[project]
name = "hanji-contracts"
version = "0.4.0"
description = "Data contracts for the hanji document parsing engine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanji_contracts"]
