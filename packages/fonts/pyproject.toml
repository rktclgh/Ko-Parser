[project]
name = "ko-parser-fonts"
version = "0.1.0"
description = "Korean font (Noto Sans KR) bundled for ko-parser PDF parsing on Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND OFL-1.1"
license-files = ["LICENSE", "src/ko_parser_fonts/fonts/OFL.txt"]
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license·license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ko_parser_fonts"]
