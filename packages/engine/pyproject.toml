[project]
name = "ko-parser-engine"
version = "0.1.0"
description = "Deterministic document parsing engine for ko-parser"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ko-parser-contracts>=0.3,<0.4", "markdown-it-py>=3,<5", "platformdirs>=4,<5", "pypdfium2>=5.8,<6",
    "pillow>=10.1,<13",
]

[project.optional-dependencies]
fonts = ["ko-parser-fonts>=0.1,<0.2"]
ocr = [
    "ko-parser-ocr-models>=0.1,<0.2", "onnxruntime>=1.20,<2", "numpy>=1.26,<3", "pyclipper>=1.3,<2",
]

[project.scripts]
ko-parser = "ko_parser.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ko_parser"]
