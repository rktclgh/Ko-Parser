[project]
name = "hanji"
version = "0.1.0"
description = "Deterministic document parsing engine for hanji"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "hanji-contracts>=0.3,<0.4", "markdown-it-py>=3,<5", "platformdirs>=4,<5", "pypdfium2>=5.8,<6",
    "pillow>=10.1,<13",
]

[project.optional-dependencies]
fonts = ["hanji-fonts>=0.1,<0.2"]
ocr = ["onnxruntime>=1.20,<2", "numpy>=1.26,<3", "pyclipper>=1.3,<2"]  # 모델 파일은 `hanji models fetch`
layout = ["onnxruntime>=1.20,<2", "numpy>=1.26,<3"]
all = ["hanji[fonts,ocr,layout]"]

[project.scripts]
hanji = "hanji.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanji"]
