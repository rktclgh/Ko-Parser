name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR은 브랜치별 그룹이라 새 커밋이 이전 실행을 취소한다. develop·main 푸시는 실행마다 그룹이 달라 커밋마다 결과가 남는다
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 기본 인코딩(Windows cp949)에 기대는 open()·read_text()를 경고로 드러내고 아래 -W로 실패시킨다
      PYTHONWARNDEFAULTENCODING: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Korean font (Linux)
        # PDFium은 미임베드 한글 글꼴을 시스템 글꼴로 대신 그린다. 러너에 한글 글꼴이 없으면 한 글자짜리 글자 객체가
        # 텍스트에서 빠진다(extract.py가 ParseError로 알린다). macOS·Windows는 기본 한글 글꼴이 있다
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
      - name: Sync
        run: uv sync --locked
      - name: Tests
        # EncodingWarning 오류화는 pyproject filterwarnings가 한다. 명령줄 -W는 그 안의 pypdfium2 예외 필터를 덮어쓰므로 쓰지 않는다
        run: uv run pytest -q
      - name: Contract schemas up to date
        run: uv run python -W error::EncodingWarning -m ko_parser_contracts.schema --check
      - name: Contract fixtures up to date
        run: uv run python -W error::EncodingWarning packages/contracts/tests/build_fixtures.py --check
      - name: Engine fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_fixtures.py --check
      - name: Engine PDF fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_pdf_fixtures.py --check
