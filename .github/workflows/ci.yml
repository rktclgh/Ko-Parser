name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR은 브랜치별 그룹이라 새 커밋이 이전 실행을 취소한다. develop·main 푸시는 실행마다 그룹이 달라 커밋마다 결과가 남는다
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 기본 인코딩(Windows cp949)에 기대는 open()·read_text()를 경고로 드러내고 아래 -W로 실패시킨다
      PYTHONWARNDEFAULTENCODING: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # ubuntu에는 한글 글꼴을 설치하지 않는다: 워크스페이스의 ko-parser-fonts가 PDFium에 등록되는지 검증한다
      # (번들 없을 때 가드는 test_pdf_fonts가 하위 프로세스로 검증)
      - name: Sync
        run: uv sync --locked
      # 워크스페이스는 OCR 추가 설치(ko-parser-engine[ocr])까지 깐다: onnxruntime 휠이 세 OS에 있고 모델이 열리는지 본다
      - name: OCR runtime loads
        run: uv run python -W error::EncodingWarning -c "from ko_parser.formats.pdf import ocr; ocr.get_reader(); print('ocr ok')"
      - name: Tests
        # EncodingWarning 오류화는 pyproject filterwarnings가 한다. 명령줄 -W는 그 안의 pypdfium2 예외 필터를 덮어쓰므로 쓰지 않는다
        env:
          # 리눅스에만 준다(env에는 if를 못 쓴다): 시스템 한글 글꼴이 생겨 번들 없음 가드 시험이 건너뛰어지면 실패시킨다
          KO_PARSER_CI_NO_KOREAN_FONT: ${{ runner.os == 'Linux' && '1' || '' }}
        run: uv run pytest -q
      - name: Contract schemas up to date
        run: uv run python -W error::EncodingWarning -m ko_parser_contracts.schema --check
      - name: Contract fixtures up to date
        run: uv run python -W error::EncodingWarning packages/contracts/tests/build_fixtures.py --check
      - name: Engine fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_fixtures.py --check
      - name: Engine PDF fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_pdf_fixtures.py --check
